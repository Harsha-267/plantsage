{% extends 'plantapp/base.html' %}
{% block title %}Shop{% endblock %}

{% block content %}
<div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="text-success">🛒 Browse Plants & Tools</h2>
        <a href="{% url 'home' %}" class="btn btn-outline-success"><i class="bi bi-house-door"></i> Home</a>
    </div>

    <div class="card mb-4 shadow-sm">
        <div class="card-body">
            <div class="row g-3">
                <div class="col-md-8">
                    <input type="text" id="searchBar" class="form-control" placeholder="Search for plants or tools...">
                </div>
                <div class="col-md-4">
                    <select id="filterType" class="form-select">
                        <option value="all">All Products</option>
                        <option value="plant">Plants</option>
                        <option value="tool">Tools</option>
                    </select>
                </div>
            </div>
        </div>
    </div>

    <div class="row" id="product-container"></div>

    <!-- Back to Top -->
    <button onclick="scrollToTop()" class="btn btn-success position-fixed bottom-0 end-0 m-4 rounded-circle d-none" id="backToTopBtn">
        <i class="bi bi-arrow-up"></i>
    </button>
</div>
{% endblock %}

const container = document.getElementById("product-container");
const searchBar = document.getElementById("searchBar");
const filterType = document.getElementById("filterType");

function renderProducts(filtered) {
    container.innerHTML = "";
    if (!filtered.length) {
        container.innerHTML = '<div class="text-center text-muted py-4">No products found.</div>';
        return;
    }

    filtered.forEach(p => {
        const col = document.createElement("div");
        col.className = "col-md-4 mb-4";
        col.innerHTML = `
            <div class="card shadow-sm h-100">
                <img src="/media/plant_images/${p.image}" class="card-img-top" style="height: 250px; object-fit: cover;" alt="${p.name}">
                <div class="card-body d-flex flex-column">
                    <h5 class="card-title">${p.name}</h5>
                    <p class="card-text mb-3">Price: ${p.price}</p>
                    <a href="${p.link}" class="btn btn-success mt-auto" target="_blank" rel="noopener noreferrer">Buy Now</a>
                </div>
            </div>
        `;
        container.appendChild(col);
    });
}

function filterProducts() {
    const query = searchBar.value.toLowerCase();
    const type = filterType.value;
    const result = products.filter(p => 
        p.name.toLowerCase().includes(query) && 
        (type === "all" || p.type === type)
    );
    renderProducts(result);
}

searchBar.addEventListener("input", filterProducts);
filterType.addEventListener("change", filterProducts);

const topBtn = document.getElementById("backToTopBtn");
window.onscroll = () => {
    topBtn.classList.toggle("d-none", window.scrollY < 200);
};
function scrollToTop() {
    window.scrollTo({ top: 0, behavior: 'smooth' });
}

// Initial load
renderProducts(products);
